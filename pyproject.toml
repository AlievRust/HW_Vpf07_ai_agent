[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-ai-agent"
version = "0.1.0"
description = "Терминальный AI-агент с CLI и Telegram-интерфейсом, инструментами поиска, файловой системы, погоды и криптовалюты"
requires-python = ">=3.10"
dependencies = [
  "openai",
  "langchain",
  "langchain-openai",
  "ddgs",
  "python-telegram-bot",
  "requests",
  "python-dotenv",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
